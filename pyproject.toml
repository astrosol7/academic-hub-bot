[project]
name = "academic-hub-bot"
version = "0.1.0"
description = "SIT Academic Hub Bot & Dashboard"
authors = [{ name = "Orbit Team" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic",
    "python-multipart",
    "python-jose[cryptography]",
    "PyJWT",
    "passlib[bcrypt]",
    "python-dotenv",
    "aiogram",
    "aiofiles",
    "httpx",
    "alembic",
    "psutil",
    "click",
    "rich",
    "typer",
    "google-auth"
]

[project.scripts]
app = "api.index:app"

# ── TYPE CHECKER CONFIG ────────────────────────────────────────────────────────
# This mirrors the runtime PYTHONPATH set by launcher.py:
#   env["PYTHONPATH"] = root + os.pathsep + os.path.join(root, "src")
# "." gives access to api.*, backend.*, etc. (root-level packages)
# "src" gives access to bot.*, core.*, etc. (src-level packages)
[tool.pyright]
pythonVersion = "3.12"
extraPaths = [".", "src"]
reportMissingModuleSource = "none"

# Pyrefly (Meta's type checker) uses its own section.
# search_path mirrors the runtime PYTHONPATH set by launcher.py.
[tool.pyrefly]
search_path = [".", "src"]

